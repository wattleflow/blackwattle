# Grafana configuration for the wattleflow monitoring instance (FRQ-OPS-20.1).
#
# No credential and no signing key lives here (P-23, NFRQ-SEC-09): Grafana
# reads GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD and
# GF_SECURITY_SECRET_KEY from the environment the compose file builds from
# `.env`. An environment variable overrides any key in this file.

[branding]
app_title = WattleFlow
login_title = WattleFlow Monitoring
login_subtitle = Resource cost analysis per run
footer_link_text = WattleFlow documentation
footer_link_url = https://github.com/wattleflow/documentation

[server]
root_url = http://localhost:3000

[auth.anonymous]
# Off: every viewer signs in (NFRQ-SEC-13 c.2).
enabled = false

[users]
allow_sign_up = false
default_theme = dark

[analytics]
# No traffic to the vendor from a laptop instance (NFRQ-SEC-13 c.2).
reporting_enabled = false
check_for_updates = false

[alerting]
# No alerting rules: a threshold picked before the process has a history is
# tampering (NFRQ-OBS-04 c.7).
enabled = false

[log]
level = info
