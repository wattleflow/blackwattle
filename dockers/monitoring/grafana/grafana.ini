# Grafana configuration for WattleFlow monitoring
# Theme and branding configuration

[theme]
default = dark
disable_transient_locale = false

[branding]
app_title = WattleFlow
login_title = WattleFlow Monitoring
login_subtitle = Resource cost analysis per run
favicon = public/img/fav32.png
apple_touch_icon = public/img/apple-touch-icon.png
footer_link_text = WattleFlow Documentation
footer_link_url = https://github.com/wattleflow/core

[security]
admin_user = admin
admin_password = admin
secret_key = wattleflow-dev-secret-key-change-in-prod

[server]
root_url = http://localhost:3000
serve_from_sub_path = false

[database]
type = sqlite3
path = /var/lib/grafana/grafana.db

[session]
provider = file

[auth.anonymous]
enabled = true
org_role = Viewer

[analytics]
reporting_enabled = false
check_for_updates = true

[explore]
enabled = true

[alerting]
enabled = false

[logs]
level = info
